name: FastMCP-Sentinel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-14, ubuntu-latest ]
        python-version: [ "3.12" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest requests pydantic mcp

      - name: Compile C++ Invariant Core
        run: make csrc

      - name: Execute Full Test Suite
        run: pytest tests/ -v

      - name: Verify Power of 10 Safety Invariants (AST Audit)
        run: python scripts/audit_safety_invariants.py

      - name: Run 1-Second Live End-to-End Demo
        run: python scripts/run_demo.py
