name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff>=0.6" "mypy>=1.10" types-requests "mcp>=1.29.1,<2" "pydantic>=2" "requests>=2.31"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install package (dev extras)
        run: pip install -e ".[dev]"
      - name: Build native core in source tree
        run: make csrc
      - name: Run test suite
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Power of 10 audit
        run: fastmcp-sentinel audit --csrc-dir csrc
      - name: End-to-end demo
        run: fastmcp-sentinel demo
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  native-sanitizers:
    name: Native tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/asan -DCMAKE_BUILD_TYPE=Debug -DSENTINEL_SANITIZE=ON -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build/asan --parallel
      - name: Run native tests
        run: ctest --test-dir build/asan --output-on-failure

  package:
    name: Build & smoke-test distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build --outdir dist
      - name: Install wheel into a clean venv and test it from outside the repo
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl pytest anyio
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/fastmcp-sentinel" --version
          "$RUNNER_TEMP/venv/bin/fastmcp-sentinel" check
          "$RUNNER_TEMP/venv/bin/python" -m pytest "$GITHUB_WORKSPACE/tests" -q -o pythonpath= -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/
