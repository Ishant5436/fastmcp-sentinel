[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "fastmcp-sentinel"
dynamic = ["version"]
description = "Deterministic Agentic Safety & RPC Gateway for Autonomous Agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "FastMCP-Sentinel contributors" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "evm", "safety", "web3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.29.1,<2",
    "pydantic>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
    "pycryptodome>=3.20",
]
e2e = [
    "playwright>=1.45",
]

[project.urls]
Homepage = "https://github.com/Ishant5436/fastmcp-sentinel"
Issues = "https://github.com/Ishant5436/fastmcp-sentinel/issues"

[project.scripts]
fastmcp-sentinel = "fastmcp_sentinel.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/fastmcp_sentinel"]
# The native library is loaded via ctypes (no CPython ABI), so one wheel per platform suffices.
wheel.py-api = "py3"
cmake.build-type = "Release"
sdist.exclude = [
    "assets/*.mp4", "assets/*.gif", "venv", ".venv", "build", "csrc/*.so", "csrc/*.dylib",
    "contracts/lib", "contracts/out", "contracts/cache", "contracts/broadcast",
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/fastmcp_sentinel/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["fastmcp_sentinel"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = [
    "S101",   # assert is used deliberately (Power of 10 Rule 5) and in tests
    "UP006", "UP035",  # keep typing.Dict/List style used across the codebase
    "RUF001", # "µs" in user-facing output
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
"src/fastmcp_sentinel/cli.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/fastmcp_sentinel"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
